[package]
name = "infera"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
name = "infera"
crate-type = ["staticlib", "cdylib"]

[features]
duckdb_extension = []
default = ["tract"]
tract = ["dep:tract-onnx", "dep:ndarray"]

[dependencies]
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "2.0"
serde_json = "1.0"
tract-onnx = { version = "0.22", optional = true }
ndarray = { version = "0.17.1", optional = true }
sha2 = "0.11.0"
hex = "0.4"
filetime = "0.2"
time = { version = "=0.3.47", default-features = false }

# reqwest pulls in tokio and mio, which do not support WebAssembly. Remote model
# downloading is therefore compiled only for non-wasm targets; the wasm build loads
# models from local paths provided through DuckDB instead.
#
# reqwest uses the rustls-no-provider feature so the crypto provider is chosen here
# rather than defaulting to aws-lc-rs. The ring provider is installed at runtime in
# http.rs because aws-lc-sys fails to build its ARMv8 assembly under the MSVC toolchain
# on windows_arm64, while ring compiles cleanly on that target.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.13.3", features = ["blocking", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
tempfile = "3.10"
mockito = "1.7.0"
tiny_http = "0.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true
